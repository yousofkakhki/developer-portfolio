<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Interactive hologram delivery architecture</title>
  <desc id="desc">Camera input passes through pose estimation and an API or WebSocket control boundary to the projection renderer, which retains a stable fallback state.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#13243A"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22D3EE"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#F59E0B"/></marker></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="90" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F3F7FB" letter-spacing="3">INTERACTIVE INSTALLATION PIPELINE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0D1A2B" stroke="#22D3EE" stroke-width="3"><rect x="80" y="280" width="270" height="130" rx="14"/><rect x="460" y="280" width="270" height="130" rx="14"/><rect x="840" y="280" width="300" height="130" rx="14"/><rect x="1250" y="280" width="270" height="130" rx="14"/></g>
    <g fill="#F3F7FB" font-size="25" font-weight="600"><text x="215" y="352">Camera input</text><text x="595" y="335">Pose</text><text x="595" y="370">estimation</text><text x="990" y="335">API / WebSocket</text><text x="990" y="370">control boundary</text><text x="1385" y="335">Projection</text><text x="1385" y="370">renderer</text></g>
    <g stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow)"><path d="M350 345H445"/><path d="M730 345H825"/><path d="M1140 345H1235"/></g>
    <rect x="1170" y="590" width="430" height="120" rx="14" fill="#0D1A2B" stroke="#F59E0B" stroke-width="3"/>
    <text x="1385" y="640" fill="#F3F7FB" font-size="25" font-weight="600">Stable fallback behavior</text><text x="1385" y="678" fill="#A7B4C5" font-size="21">when input, inference, or transport is unavailable</text>
    <path d="M1385 410V575" stroke="#F59E0B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#amber)"/>
  </g>
  <text x="90" y="802" font-family="Arial, sans-serif" font-size="22" fill="#A7B4C5">Perception emits bounded application events; presentation remains responsible for visible recovery.</text>
</svg>
