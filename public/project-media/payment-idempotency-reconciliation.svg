<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Idempotent payment workflow and reconciliation</title>
  <desc id="desc">A request enters an idempotency boundary, persists a payment intent, calls provider adapters, classifies the result, and uses reconciliation to recover timeouts and uncertain states.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#13243A"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22D3EE"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#F59E0B"/></marker></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="90" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F3F7FB" letter-spacing="3">DURABLE PAYMENT WORKFLOW</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0D1A2B" stroke="#22D3EE" stroke-width="3"><rect x="70" y="180" width="250" height="112" rx="14"/><rect x="380" y="180" width="250" height="112" rx="14"/><rect x="690" y="180" width="250" height="112" rx="14"/><rect x="1000" y="180" width="250" height="112" rx="14"/><rect x="1310" y="180" width="220" height="112" rx="14"/></g>
    <g fill="#F3F7FB" font-size="24" font-weight="600"><text x="195" y="246">Request</text><text x="505" y="226">Idempotency</text><text x="505" y="258">boundary</text><text x="815" y="226">Persisted</text><text x="815" y="258">payment intent</text><text x="1125" y="226">Provider</text><text x="1125" y="258">adapters</text><text x="1420" y="226">Result</text><text x="1420" y="258">handling</text></g>
    <g stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow)"><path d="M320 236H365"/><path d="M630 236H675"/><path d="M940 236H985"/><path d="M1250 236H1295"/></g>
    <g fill="#0D1A2B" stroke="#F59E0B" stroke-width="3"><rect x="150" y="520" width="310" height="112" rx="14"/><rect x="645" y="520" width="310" height="112" rx="14"/><rect x="1140" y="520" width="310" height="112" rx="14"/></g>
    <g fill="#F3F7FB" font-size="24" font-weight="600"><text x="305" y="566">Duplicate request</text><text x="305" y="600" font-size="20" fill="#A7B4C5">return persisted state</text><text x="800" y="566">Retryable / terminal</text><text x="800" y="600" font-size="20" fill="#A7B4C5">classify before retry</text><text x="1295" y="566">Reconciliation</text><text x="1295" y="600" font-size="20" fill="#A7B4C5">recover uncertain state</text></g>
    <path d="M505 292V460H305V505" fill="none" stroke="#F59E0B" stroke-width="4" marker-end="url(#amber)"/><path d="M1420 292V440H800V505" fill="none" stroke="#F59E0B" stroke-width="4" marker-end="url(#amber)"/><path d="M1125 292V390H1295V505" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#amber)"/>
    <text x="1210" y="378" fill="#F59E0B" font-size="20">provider timeout</text>
    <path d="M1140 576H970" stroke="#F59E0B" stroke-width="4" marker-end="url(#amber)"/>
    <text x="1055" y="558" fill="#F59E0B" font-size="19">recovery</text>
  </g>
  <text x="90" y="802" font-family="Arial, sans-serif" font-size="22" fill="#A7B4C5">External responses are observations; persisted transitions remain the source of workflow truth.</text>
</svg>
