<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Live session and post-session media paths</title>
  <desc id="desc">The live session uses WebRTC and LiveKit with Go services and NATS JetStream coordination. After a time boundary, recorded output is processed and packaged for HLS playback available later.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#13243A"/></linearGradient>
    <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22D3EE"/></marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#F59E0B"/></marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif" fill="#F3F7FB">
    <text x="96" y="92" font-size="30" font-weight="700" letter-spacing="4">LIVE SESSION</text>
    <text x="1504" y="500" font-size="30" font-weight="700" letter-spacing="4" text-anchor="end">POST-SESSION</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0D1A2B" stroke="#22D3EE" stroke-width="3">
      <rect x="96" y="142" width="400" height="116" rx="14"/><rect x="600" y="142" width="400" height="116" rx="14"/><rect x="1104" y="142" width="400" height="116" rx="14"/>
    </g>
    <g fill="#F3F7FB" font-size="27" font-weight="600">
      <text x="296" y="194">Interactive participation</text><text x="800" y="194">WebRTC / LiveKit</text><text x="1304" y="187">Application coordination</text><text x="1304" y="222" font-size="23" fill="#A7B4C5">Go services + NATS JetStream</text>
    </g>
    <path d="M496 200H585" stroke="#22D3EE" stroke-width="4" marker-end="url(#cyanArrow)"/><path d="M1000 200H1089" stroke="#22D3EE" stroke-width="4" marker-end="url(#cyanArrow)"/>
    <path d="M800 278V348" stroke="#22D3EE" stroke-width="4" stroke-dasharray="9 10"/>
    <line x1="96" y1="400" x2="1504" y2="400" stroke="#A7B4C5" stroke-width="2" stroke-dasharray="14 14"/>
    <rect x="606" y="373" width="388" height="54" rx="27" fill="#08111F" stroke="#A7B4C5"/>
    <text x="800" y="408" font-family="Arial, sans-serif" font-size="20" fill="#A7B4C5" letter-spacing="3">TIME BOUNDARY</text>
    <g fill="#0D1A2B" stroke="#F59E0B" stroke-width="3">
      <rect x="96" y="550" width="400" height="116" rx="14"/><rect x="600" y="550" width="400" height="116" rx="14"/><rect x="1104" y="550" width="400" height="116" rx="14"/>
    </g>
    <g fill="#F3F7FB" font-size="27" font-weight="600">
      <text x="296" y="602">Recorded session output</text><text x="800" y="602">Processing and packaging</text><text x="1304" y="594">HLS playback</text><text x="1304" y="630" font-size="23" fill="#A7B4C5">available later</text>
    </g>
    <path d="M496 608H585" stroke="#F59E0B" stroke-width="4" marker-end="url(#amberArrow)"/><path d="M1000 608H1089" stroke="#F59E0B" stroke-width="4" marker-end="url(#amberArrow)"/>
  </g>
  <text x="96" y="804" font-family="Arial, sans-serif" font-size="22" fill="#A7B4C5">Verified implementation boundary — live participation and later playback are separate paths.</text>
</svg>
