<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Installation readiness boundaries</title>
  <desc id="desc">Changing light, bounded compute, camera input, and transport readiness feed an explicit readiness gate before the projected experience is activated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#13243A"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22D3EE"/></marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="90" y="92" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F3F7FB" letter-spacing="3">INSTALLATION READINESS BOUNDARY</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0D1A2B" stroke="#22D3EE" stroke-width="3">
      <rect x="80" y="230" width="300" height="120" rx="14"/>
      <rect x="80" y="410" width="300" height="120" rx="14"/>
      <rect x="80" y="590" width="300" height="120" rx="14"/>
    </g>
    <g fill="#F3F7FB" font-size="24" font-weight="600">
      <text x="230" y="302">Camera and lighting</text>
      <text x="230" y="482">Compute availability</text>
      <text x="230" y="662">Control transport</text>
    </g>
    <rect x="620" y="345" width="360" height="230" rx="18" fill="#0D1A2B" stroke="#F59E0B" stroke-width="4"/>
    <text x="800" y="438" fill="#F3F7FB" font-size="29" font-weight="700">Readiness gate</text>
    <text x="800" y="482" fill="#A7B4C5" font-size="21">explicit state before activation</text>
    <rect x="1210" y="345" width="310" height="230" rx="18" fill="#0D1A2B" stroke="#22D3EE" stroke-width="4"/>
    <text x="1365" y="438" fill="#F3F7FB" font-size="27" font-weight="700">Projected</text>
    <text x="1365" y="477" fill="#F3F7FB" font-size="27" font-weight="700">experience</text>
    <text x="1365" y="523" fill="#A7B4C5" font-size="20">activated deliberately</text>
    <g stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow)"><path d="M380 290H540V405H605"/><path d="M380 470H605"/><path d="M380 650H540V515H605"/><path d="M980 460H1195"/></g>
  </g>
  <text x="800" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#A7B4C5">Event-environment constraints are treated as operating inputs, not hidden assumptions.</text>
</svg>
