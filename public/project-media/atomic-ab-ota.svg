<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Atomic A/B over-the-air update workflow</title>
  <desc id="desc">An artifact is built and signed, written to the inactive partition, verified, selected as a boot target, and committed only after a health check; failure rolls back.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#13243A"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22D3EE"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#F59E0B"/></marker></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="90" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F3F7FB" letter-spacing="3">ATOMIC A/B UPDATE WORKFLOW</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0D1A2B" stroke="#22D3EE" stroke-width="3"><rect x="50" y="170" width="220" height="108" rx="14"/><rect x="310" y="170" width="220" height="108" rx="14"/><rect x="570" y="170" width="240" height="108" rx="14"/><rect x="850" y="170" width="220" height="108" rx="14"/><rect x="1110" y="170" width="220" height="108" rx="14"/><rect x="1370" y="170" width="180" height="108" rx="14"/></g>
    <g fill="#F3F7FB" font-size="22" font-weight="600"><text x="160" y="235">Artifact build</text><text x="420" y="235">Signing</text><text x="690" y="218">Inactive partition</text><text x="690" y="249">write</text><text x="960" y="235">Verification</text><text x="1220" y="218">Boot target</text><text x="1220" y="249">switch</text><text x="1460" y="218">Health</text><text x="1460" y="249">check</text></g>
    <g stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow)"><path d="M270 224H295"/><path d="M530 224H555"/><path d="M810 224H835"/><path d="M1070 224H1095"/><path d="M1330 224H1355"/></g>
    <g fill="#0D1A2B" stroke-width="3"><rect x="1020" y="550" width="250" height="110" rx="14" stroke="#16F2B3"/><rect x="1320" y="550" width="230" height="110" rx="14" stroke="#F59E0B"/></g>
    <text x="1145" y="616" fill="#F3F7FB" font-size="25" font-weight="600">Commit</text><text x="1435" y="616" fill="#F3F7FB" font-size="25" font-weight="600">Rollback</text>
    <path d="M1460 278V450H1145V535" fill="none" stroke="#16F2B3" stroke-width="4" marker-end="url(#arrow)"/><path d="M1460 278V535" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#amber)"/>
    <text x="1195" y="438" fill="#16F2B3" font-size="20">success</text><text x="1498" y="445" fill="#F59E0B" font-size="20">failure</text>
  </g>
  <text x="90" y="802" font-family="Arial, sans-serif" font-size="22" fill="#A7B4C5">The active system is preserved until verification and health checks establish a safe commit.</text>
</svg>
