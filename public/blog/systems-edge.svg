<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#1a0f0a"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316" opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="200" fill="#f97316" opacity="0.04"/>
  <circle cx="1100" cy="530" r="180" fill="#fbbf24" opacity="0.04"/>

  <!-- Stack: App → eBPF → Kernel → Hardware -->
  <rect x="100" y="140" width="160" height="48" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="180" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f97316">Userspace App</text>

  <line x1="260" y1="164" x2="320" y2="164" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="320" y="140" width="160" height="48" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <text x="400" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fbbf24">eBPF Hook</text>
  <text x="400" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" opacity="0.8">zero-copy observe</text>

  <line x1="480" y1="164" x2="540" y2="164" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="540" y="140" width="160" height="48" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="620" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f97316">Kernel Space</text>
  <text x="620" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#f97316" opacity="0.8">scheduler tuning</text>

  <line x1="700" y1="164" x2="760" y2="164" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="760" y="140" width="160" height="48" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <text x="840" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fbbf24">Hardware</text>
  <text x="840" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" opacity="0.8">cache / IRQ affinity</text>

  <!-- OTA branch -->
  <line x1="840" y1="188" x2="840" y2="230" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="760" y="230" width="160" height="48" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="840" y="251" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f97316">OTA Pipeline</text>
  <text x="840" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#f97316" opacity="0.8">delta update · rollback</text>

  <!-- Title -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="white">Linux Kernel &amp; Edge</text>
  <text x="600" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="url(#accent)">Systems Engineering</text>
  <text x="600" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#94a3b8">eBPF · kernel tuning · OTA delivery pipelines</text>

  <rect x="100" y="532" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">eBPF · Linux Kernel · C · Rust · OTA · Edge Computing</text>
</svg>
