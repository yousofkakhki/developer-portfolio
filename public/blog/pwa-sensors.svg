<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#140d24"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7" opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="200" fill="#a855f7" opacity="0.04"/>
  <circle cx="1100" cy="530" r="180" fill="#ec4899" opacity="0.04"/>

  <!-- Browser → Service Worker → IndexedDB / Sensor API -->
  <rect x="80" y="150" width="150" height="48" rx="8" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="155" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a855f7">Browser</text>

  <line x1="230" y1="174" x2="290" y2="174" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="290" y="150" width="200" height="48" rx="8" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <text x="390" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ec4899">Service Worker</text>
  <text x="390" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#ec4899" opacity="0.8">offline-first cache</text>

  <!-- SW → IndexedDB + Sensor API -->
  <line x1="490" y1="164" x2="560" y2="140" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="490" y1="184" x2="560" y2="210" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="560" y="118" width="170" height="48" rx="8" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="645" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a855f7">IndexedDB</text>
  <text x="645" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#a855f7" opacity="0.8">offline queue</text>

  <rect x="560" y="190" width="170" height="48" rx="8" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <text x="645" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ec4899">Sensor API</text>
  <text x="645" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#ec4899" opacity="0.8">accel · gyro · DSP</text>

  <!-- Sensor → Sleep Analysis -->
  <line x1="730" y1="214" x2="790" y2="214" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="790" y="190" width="170" height="48" rx="8" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
  <text x="875" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a855f7">Sleep Analysis</text>
  <text x="875" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#a855f7" opacity="0.8">WASM · ML inference</text>

  <!-- Title -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="white">PWA + Web Sensors</text>
  <text x="600" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="url(#accent)">Offline-First Engineering</text>
  <text x="600" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#94a3b8">Service Worker · IndexedDB · WASM · Sleep Tracking</text>

  <rect x="100" y="532" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">PWA · Web Sensors · IndexedDB · WASM · DSP · TypeScript</text>
</svg>
