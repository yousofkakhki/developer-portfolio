<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#1a1443"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16f2b3"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="200" fill="#16f2b3" opacity="0.05"/>
  <circle cx="1050" cy="480" r="180" fill="#8b5cf6" opacity="0.05"/>
  
  <!-- Architecture boxes -->
  <rect x="100" y="200" width="200" height="80" rx="8" fill="none" stroke="#16f2b3" stroke-width="2" opacity="0.5"/>
  <text x="200" y="245" text-anchor="middle" font-family="system-ui" font-size="16" fill="#16f2b3">WebRTC</text>
  
  <rect x="500" y="200" width="200" height="80" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui" font-size="16" fill="#8b5cf6">NATS JetStream</text>
  
  <rect x="900" y="200" width="200" height="80" rx="8" fill="none" stroke="#16f2b3" stroke-width="2" opacity="0.5"/>
  <text x="1000" y="245" text-anchor="middle" font-family="system-ui" font-size="16" fill="#16f2b3">HLS CDN</text>
  
  <!-- Connecting lines -->
  <line x1="300" y1="240" x2="500" y2="240" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="700" y1="240" x2="900" y2="240" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="white">Hybrid WebRTC-HLS</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)">Architecture</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">Scaling to 1000+ Users</text>
  
  <rect x="100" y="520" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#64748b">LiveKit • NATS • Node.js • React • Real-time Signaling</text>
</svg>

