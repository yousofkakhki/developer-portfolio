<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#1a1408"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#eab308" opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="200" fill="#eab308" opacity="0.04"/>
  <circle cx="1100" cy="530" r="180" fill="#f97316" opacity="0.04"/>

  <!-- Tech Lead → teams + journey -->
  <rect x="80" y="150" width="160" height="48" rx="8" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>
  <text x="160" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#eab308">Tech Lead</text>
  <text x="160" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#eab308" opacity="0.8">10 yr · AI Manager</text>

  <!-- Three branches -->
  <line x1="240" y1="164" x2="310" y2="130" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="240" y1="174" x2="310" y2="174" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="240" y1="184" x2="310" y2="218" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="310" y="108" width="170" height="46" rx="8" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>
  <text x="395" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#eab308">Backend Team</text>

  <rect x="310" y="152" width="170" height="46" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="395" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#f97316">AI Systems</text>

  <rect x="310" y="196" width="170" height="46" rx="8" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>
  <text x="395" y="223" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#eab308">Product Eng</text>

  <!-- Journey arrow -->
  <line x1="600" y1="174" x2="680" y2="174" stroke="#eab308" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="640" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#eab308" opacity="0.7">Iran → EU</text>

  <rect x="680" y="150" width="180" height="48" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
  <text x="770" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#f97316">Blue Card / HSM</text>
  <text x="770" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#f97316" opacity="0.8">DE · NL · EU target</text>

  <line x1="860" y1="174" x2="930" y2="174" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="930" y="150" width="180" height="48" rx="8" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>
  <text x="1020" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#eab308">Build in Public</text>
  <text x="1020" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#eab308" opacity="0.8">kakhki.me · LinkedIn</text>

  <!-- Title -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="white">Engineering Leadership</text>
  <text x="600" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="url(#accent)">and the EU Journey</text>
  <text x="600" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#94a3b8">Tech Lead · AI Manager · Iran → EU · Blue Card</text>

  <rect x="100" y="532" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Leadership · Hiring · Team Building · Career · EU Immigration</text>
</svg>
