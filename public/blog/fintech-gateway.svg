<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#0f2218"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16f2b3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e" opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="220" fill="#22c55e" opacity="0.04"/>
  <circle cx="1100" cy="530" r="200" fill="#16f2b3" opacity="0.04"/>

  <!-- Flow: Client → API GW → Redis → Handler → Kafka → Fiat Rail -->
  <!-- Row 1 -->
  <rect x="60"  y="160" width="140" height="52" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="130" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#22c55e">Client</text>

  <line x1="200" y1="186" x2="260" y2="186" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="260" y="160" width="180" height="52" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="350" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#22c55e">API Gateway</text>
  <text x="350" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#16f2b3" opacity="0.8">idempotency key</text>

  <line x1="440" y1="186" x2="500" y2="186" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="500" y="160" width="160" height="52" rx="8" fill="none" stroke="#16f2b3" stroke-width="1.5" opacity="0.6"/>
  <text x="580" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#16f2b3">Redis SETNX</text>
  <text x="580" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#16f2b3" opacity="0.8">24h TTL</text>

  <line x1="660" y1="186" x2="720" y2="186" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="720" y="160" width="160" height="52" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="191" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#22c55e">Business Logic</text>

  <!-- Row 2: Kafka + Fiat Rail -->
  <line x1="800" y1="212" x2="800" y2="260" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="660" y="260" width="160" height="52" rx="8" fill="none" stroke="#16f2b3" stroke-width="1.5" opacity="0.6"/>
  <text x="740" y="283" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#16f2b3">Kafka Topic</text>
  <text x="740" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#16f2b3" opacity="0.8">domain events</text>

  <line x1="820" y1="286" x2="880" y2="286" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="880" y="260" width="160" height="52" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="960" y="283" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#22c55e">Fiat Rail</text>
  <text x="960" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#22c55e" opacity="0.8">compensating tx</text>

  <!-- Title -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="white">Idempotent Payment</text>
  <text x="600" y="455" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="url(#accent)">Gateway at Five Nines</text>
  <text x="600" y="505" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#94a3b8">$12M daily · Crypto-to-Fiat · 99.999% uptime</text>

  <rect x="100" y="542" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="585" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Redis · Kafka · Saga Pattern · Idempotency Keys · Node.js</text>
</svg>
