<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Live WebRTC and delayed HLS architecture</title>
  <desc id="desc">LiveKit WebRTC serves interactive participants while NATS JetStream and Go coordinate the application. Post-session processing makes HLS playback available later.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.56" stop-color="#0D1A2B"/>
      <stop offset="1" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 112H1200M0 332H1200M0 508H1200" stroke="#94A3B8" stroke-opacity="0.12"/>
  <path d="M80 0V630M360 0V630M650 0V630M930 0V630" stroke="#94A3B8" stroke-opacity="0.08"/>

  <text x="72" y="72" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3" fill="#22D3EE">LIVE SESSION / VERIFIED PUBLIC BOUNDARY</text>
  <text x="72" y="98" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#F3F7FB">WebRTC live participation, delayed HLS playback</text>

  <g font-family="ui-monospace,monospace">
    <rect x="72" y="170" width="190" height="84" rx="10" fill="#0D1A2B" stroke="#22D3EE" stroke-width="2"/>
    <text x="167" y="202" text-anchor="middle" font-size="17" fill="#F3F7FB">Interactive users</text>
    <text x="167" y="228" text-anchor="middle" font-size="12" fill="#A7B4C5">platform-level concurrency boundary</text>

    <rect x="330" y="170" width="210" height="84" rx="10" fill="#0D1A2B" stroke="#22D3EE" stroke-width="2"/>
    <text x="435" y="202" text-anchor="middle" font-size="17" fill="#F3F7FB">LiveKit / WebRTC</text>
    <text x="435" y="228" text-anchor="middle" font-size="12" fill="#A7B4C5">live media path</text>

    <rect x="610" y="170" width="220" height="84" rx="10" fill="#0D1A2B" stroke="#22D3EE" stroke-width="2"/>
    <text x="720" y="202" text-anchor="middle" font-size="17" fill="#F3F7FB">NATS JetStream + Go</text>
    <text x="720" y="228" text-anchor="middle" font-size="12" fill="#A7B4C5">application coordination</text>

    <rect x="900" y="170" width="220" height="84" rx="10" fill="#13243A" stroke="#F59E0B" stroke-width="2"/>
    <text x="1010" y="202" text-anchor="middle" font-size="17" fill="#F3F7FB">Role transitions</text>
    <text x="1010" y="228" text-anchor="middle" font-size="12" fill="#A7B4C5">explicit ownership</text>
  </g>

  <line x1="262" y1="212" x2="330" y2="212" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="540" y1="212" x2="610" y2="212" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="830" y1="212" x2="900" y2="212" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <text x="72" y="370" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3" fill="#F59E0B">POST-SESSION PROCESSING / SEPARATE PLAYBACK PATH</text>
  <rect x="260" y="414" width="240" height="70" rx="10" fill="#0D1A2B" stroke="#F59E0B" stroke-width="2"/>
  <text x="380" y="444" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#F3F7FB">Recording / processing</text>
  <text x="380" y="466" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#A7B4C5">after the live session</text>
  <rect x="650" y="414" width="240" height="70" rx="10" fill="#0D1A2B" stroke="#F59E0B" stroke-width="2"/>
  <text x="770" y="444" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#F3F7FB">HLS playback</text>
  <text x="770" y="466" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#A7B4C5">available hours later</text>
  <line x1="500" y1="449" x2="650" y2="449" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>

  <text x="600" y="565" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#A7B4C5">LiveKit · WebRTC · NATS JetStream · Go · delayed HLS</text>
</svg>
