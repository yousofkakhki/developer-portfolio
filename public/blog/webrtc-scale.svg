<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1224"/>
      <stop offset="50%" style="stop-color:#1a1443"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16f2b3"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16f2b3" opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="220" fill="#16f2b3" opacity="0.04"/>
  <circle cx="1050" cy="500" r="200" fill="#8b5cf6" opacity="0.04"/>

  <!-- Browsers -->
  <rect x="60"  y="140" width="120" height="48" rx="8" fill="none" stroke="#16f2b3" stroke-width="1.5" opacity="0.6"/>
  <text x="120" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#16f2b3">Browser ×1000</text>

  <line x1="180" y1="164" x2="240" y2="164" stroke="#16f2b3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- LiveKit SFU -->
  <rect x="240" y="140" width="160" height="48" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  <text x="320" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#8b5cf6">LiveKit SFU</text>
  <text x="320" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b5cf6" opacity="0.8">WebRTC signaling</text>

  <line x1="400" y1="164" x2="460" y2="164" stroke="#16f2b3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- NATS JetStream -->
  <rect x="460" y="140" width="180" height="48" rx="8" fill="none" stroke="#16f2b3" stroke-width="1.5" opacity="0.6"/>
  <text x="550" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#16f2b3">NATS JetStream</text>
  <text x="550" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#16f2b3" opacity="0.8">event streaming</text>

  <!-- NATS → HLS fork -->
  <line x1="640" y1="164" x2="720" y2="140" stroke="#16f2b3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="640" y1="164" x2="720" y2="210" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- HLS CDN -->
  <rect x="720" y="120" width="160" height="48" rx="8" fill="none" stroke="#16f2b3" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#16f2b3">HLS CDN</text>
  <text x="800" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#16f2b3" opacity="0.8">passive viewers</text>

  <!-- Recording -->
  <rect x="720" y="190" width="160" height="48" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  <text x="800" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#8b5cf6">Recording</text>
  <text x="800" y="227" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b5cf6" opacity="0.8">egress worker</text>

  <!-- 78% cost label -->
  <rect x="940" y="150" width="200" height="48" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="1040" y="171" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#22c55e">78% cost cut</text>
  <text x="1040" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#22c55e" opacity="0.8">vs. full-mesh MCU</text>

  <!-- Title -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="white">Hybrid WebRTC + HLS</text>
  <text x="600" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="44" font-weight="bold" fill="url(#accent)">Scaling to 1000+ Users</text>
  <text x="600" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#94a3b8">SFU fan-out · adaptive bitrate · 78% infra cost reduction</text>

  <rect x="100" y="532" width="1000" height="4" fill="url(#accent)" rx="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">LiveKit · NATS JetStream · WebRTC · HLS · Node.js</text>
</svg>
