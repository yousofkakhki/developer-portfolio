services:
  prod:
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE must be set}
    container_name: developer-portfolio
    env_file:
      - /etc/kakhki.me/app.env
    environment:
      NODE_ENV: production
      ANALYTICS_DIR: /app/data/analytics
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - analytics:/app/data/analytics
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  analytics:
