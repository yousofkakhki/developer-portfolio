name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://kakhki.me' }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
          NEXT_PUBLIC_GTM: ${{ vars.NEXT_PUBLIC_GTM }}
          NEXT_PUBLIC_ENABLE_VRM_AVATAR: ${{ vars.NEXT_PUBLIC_ENABLE_VRM_AVATAR || 'true' }}

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

  build-image:
    name: Build release image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          tags: developer-portfolio:${{ github.sha }}
          outputs: type=docker,dest=/tmp/developer-portfolio.tar
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://kakhki.me' }}
            NEXT_PUBLIC_GSC_VERIFICATION=${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
            NEXT_PUBLIC_GTM=${{ vars.NEXT_PUBLIC_GTM }}
            NEXT_PUBLIC_ENABLE_VRM_AVATAR=${{ vars.NEXT_PUBLIC_ENABLE_VRM_AVATAR || 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress release image
        run: gzip -1 /tmp/developer-portfolio.tar

      - name: Upload release image
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-image-${{ github.sha }}
          path: /tmp/developer-portfolio.tar.gz
          retention-days: 3
          compression-level: 0

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://kakhki.me
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v5

      - name: Download release image
        uses: actions/download-artifact@v4
        with:
          name: portfolio-image-${{ github.sha }}
          path: /tmp/release

      - name: Configure pinned SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Transfer release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          image="/tmp/release/developer-portfolio.tar.gz"
          scp -P 22 -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$image" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/developer-portfolio-$RELEASE_SHA.tar.gz"
          scp -P 22 -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy/docker-compose.gcp.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/kakhki-compose-$RELEASE_SHA.yml"
          ssh -p 22 -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_SHA=$RELEASE_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n /usr/local/sbin/kakhki-release "$RELEASE_SHA"
          REMOTE
